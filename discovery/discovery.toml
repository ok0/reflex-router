[data]
version = "v783"
data_dir = "circuit-data/v783/raw"
reports_dir = "circuit-data/v783/reports"
manifest = "discovery/data_manifest.toml"

[zenodo]
record = "10676866"
doi = "10.5281/zenodo.10676866"
files = ["proofread_connections_783.feather", "proofread_root_ids_783.npy"]

[annotations]
repo = "flyconnectome/flywire_annotations"
tag = "v3.2.0"   # v783-based release (research annotation-root-ids C2); corrected at first fetch if wrong
path = "supplemental_files/Supplemental_file1_neuron_annotations.tsv"

[shiu]
repo = "philshiu/Drosophila_brain_model"
commit = "91bdd1e7dcf193f3e7ca5a8933497fcef63b7960"
raw_dir = "circuit-data/shiu/raw"
manifest = "discovery/shiu_manifest.toml"
vendor_files = ["LICENSE", "model.py", "utils.py"]
reference_files = ["Completeness_783.csv", "Connectivity_783.parquet"]
v630_files = ["2023_03_23_completeness_630_final.csv", "2023_03_23_connectivity_630_final.parquet"]

[model_input]
out_dir = "circuit-data/v783/model_input"

[regress]
frequencies_hz = [10, 20, 50, 100, 200]
n_trials = 30
seed_base = 783000
n_proc = 8            # bounded by RAM (one whole-brain model per worker); tune after `regress --smoke`
work_dir = "circuit-data/v783/regress"
golden = "circuit-data/v783/reports/regress_golden.json"
report = "circuit-data/v783/reports/regress_report.md"
stim_source = "Shiu example.ipynb @91bdd1e: right sugar GRNs (v630 IDs; 20 of 21 present in v783, 720575940620900446 absent) and MN9"
sugar_grn_ids = [720575940624963786, 720575940630233916, 720575940637568838, 720575940638202345, 720575940617000768, 720575940630797113, 720575940632889389, 720575940621754367, 720575940621502051, 720575940640649691, 720575940639332736, 720575940616885538, 720575940639198653, 720575940617937543, 720575940632425919, 720575940633143833, 720575940612670570, 720575940628853239, 720575940629176663, 720575940611875570]
mn9_id = 720575940660219265

[regress.v630]
sugar_grn_ids = [720575940624963786, 720575940630233916, 720575940637568838, 720575940638202345, 720575940617000768, 720575940630797113, 720575940632889389, 720575940621754367, 720575940621502051, 720575940640649691, 720575940639332736, 720575940616885538, 720575940639198653, 720575940620900446, 720575940617937543, 720575940632425919, 720575940633143833, 720575940612670570, 720575940628853239, 720575940629176663, 720575940611875570]
mn9_id = 720575940660219265

[discover]
work_dir = "circuit-data/v783/discover"          # git-ignored: job, spike counts, run result, run log
out_dir = "circuit-data/v783"                     # circuit.json + metadata.json
candidates_report = "circuit-data/v783/reports/parallel_dn_candidates.md"
responsive_table = "circuit-data/v783/reports/responsive_v783.tsv"
m2_report = "circuit-data/v783/reports/regress_report.md"
lc4_cell_type = "LC4"
lplc2_cell_type = "LPLC2"
expected_lc4 = 104       # M1 schema report
expected_lplc2 = 210
rate_hz = 150.0          # ADR-7; Shiu default r_poi
n_trials = 30
seed_base = 785000       # trial t uses seed_base + t
n_proc = 8               # execution only; results do not depend on it
min_rate_hz = 2.0        # ADR-7
min_trial_frac = 0.5     # ADR-7
gf_cell_type = "DNp01"
prior_cell_types = ["DNp02", "DNp03", "DNp04", "DNp06"]   # ADR-15, LOW evidence
reported_cell_types = ["DNp11"]
license_label = "CC BY-NC 4.0"

[robustness]
grid = "discovery/robustness.toml"
work_dir = "circuit-data/v783/discover/robustness"            # git-ignored
report = "circuit-data/v783/reports/robustness.md"
results = "circuit-data/v783/reports/robustness_results.json"
