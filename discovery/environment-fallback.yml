# py3.10 + brian2 2.5.1 env for the Shiu simulation stage only (ADR-2, ADR-14).
# Build: conda env create -f discovery/environment-fallback.yml
name: rr-shiu-fallback
channels:
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10.14
  - brian2=2.5.1
  - numpy=1.24.4
  - cython=0.29.37
  - scipy=1.11.4
  - sympy=1.12.1
  - jinja2=3.1.4
  - pyparsing=3.3.2
  - setuptools=69.5.1
  - gsl=2.8
  - pandas=1.5.3
  - pyarrow=14.0.2
  - joblib=1.3.2
  - clangxx_osx-arm64=14.0.6   # brian2 Cython codegen compiler on macOS arm64; remove this line on other platforms (documented in README)
